<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogisticsGlossaryHR — Aday Değerlendirme Sistemi</title>
<style>
:root{
  --primary:#2563EB;
  --primary-dark:#1D4ED8;
  --bg:#FFFFFF;
  --bg-secondary:#F8FAFC;
  --text:#111827;
  --text-muted:#6B7280;
  --text-faint:#9CA3AF;
  --accent:#3B82F6;
  --success:#22C55E;
  --success-bg:#ECFDF5;
  --warning:#F59E0B;
  --warning-bg:#FFFBEB;
  --danger:#EF4444;
  --danger-bg:#FEF2F2;
  --info-bg:#EFF6FF;
  --border:#E5E7EB;
  --radius:14px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(17,24,39,0.04);
  --shadow-md:0 4px 16px rgba(17,24,39,0.06);
  --shadow-lg:0 12px 36px rgba(17,24,39,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Helvetica,Arial,sans-serif;
  background:var(--bg-secondary);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  font-size:14.5px;
  line-height:1.5;
}
::selection{background:#BFDBFE;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:236px;
  flex-shrink:0;
  background:var(--bg);
  border-right:1px solid var(--border);
  padding:22px 14px;
  position:fixed;
  top:0;left:0;bottom:0;
  display:flex;
  flex-direction:column;
  z-index:40;
  transition:transform .25s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px 10px;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 4px 10px rgba(37,99,235,.28);
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;}
.brand-text span{font-size:11px;color:var(--text-muted);font-weight:500;}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:10px;
  color:var(--text-muted);font-size:13.6px;font-weight:500;
  cursor:pointer;transition:background .15s ease,color .15s ease;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--bg-secondary);color:var(--text);}
.nav-item.active{background:var(--info-bg);color:var(--primary);font-weight:600;}
.nav-item.active svg{opacity:1;}

.sidebar-footer{margin-top:auto;padding:10px;}
.save-indicator{
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--text-faint);
  padding:8px 10px;border-radius:10px;background:var(--bg-secondary);
  transition:all .2s ease;
}
.save-indicator.saved{color:var(--success);background:var(--success-bg);}
.save-indicator .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.save-indicator.saving .dot{animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.main{margin-left:236px;flex:1;min-width:0;padding:26px 34px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;}
.topbar .sub{color:var(--text-muted);font-size:13px;margin-top:3px;}

.mobile-toggle{display:none;position:fixed;top:16px;left:16px;z-index:50;background:var(--bg);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;align-items:center;justify-content:center;box-shadow:var(--shadow-md);}
.overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:39;}

/* ---------- CARDS / KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px;}
.kpi-card{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow-sm);
  transition:transform .18s ease,box-shadow .18s ease;
  animation:fadeUp .35s ease both;
}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.kpi-label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.dicon{display:inline-block;}
.kpi-value{font-size:27px;font-weight:700;letter-spacing:-.02em;}
.kpi-card.accent-primary .kpi-value{color:var(--primary);}
.kpi-card.accent-success .kpi-value{color:var(--success);}
.kpi-card.accent-warning .kpi-value{color:var(--warning);}
.kpi-card.accent-danger .kpi-value{color:var(--danger);}
.kpi-card.accent-muted .kpi-value{color:var(--text-muted);}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);animation:fadeUp .35s ease both;}
.panel + .panel{margin-top:20px;}
.panel-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.panel-header h2{font-size:15.5px;font-weight:700;margin:0;letter-spacing:-.01em;}
.panel-body{padding:20px;}

/* ---------- TOOLBAR / FILTERS ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg-secondary);border-radius:var(--radius) var(--radius) 0 0;}
.search-box{position:relative;flex:1;min-width:200px;}
.search-box input{
  width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s;
}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}
select.filter-select{
  padding:9px 30px 9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);
  outline:none;cursor:pointer;color:var(--text);min-width:130px;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B7280'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
select.filter-select:focus{border-color:var(--primary);}
.clear-filters{font-size:12.5px;color:var(--primary);font-weight:600;cursor:pointer;padding:9px 6px;white-space:nowrap;}
.clear-filters:hover{text-decoration:underline;}
.result-count{font-size:12.5px;color:var(--text-muted);padding:0 20px;margin-top:12px;}

/* ---------- TABLE ---------- */
.table-wrap{overflow-x:auto;}
table.candidates{width:100%;border-collapse:collapse;font-size:13.4px;}
table.candidates th{
  text-align:left;padding:11px 16px;color:var(--text-muted);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.candidates td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.candidates tbody tr{cursor:pointer;transition:background .12s ease;}
table.candidates tbody tr:hover{background:var(--bg-secondary);}
table.candidates tbody tr:last-child td{border-bottom:none;}
.name-cell{display:flex;align-items:center;gap:10px;}
.avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;
}
.name-main{font-weight:600;color:var(--text);}
.name-sub{font-size:11.8px;color:var(--text-faint);margin-top:1px;}
.cell-muted{color:var(--text-muted);}
.chev{color:var(--text-faint);}

/* ---------- BADGES ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.8px;font-weight:600;white-space:nowrap;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-success{background:var(--success-bg);color:#15803D;}
.badge-warning{background:var(--warning-bg);color:#B45309;}
.badge-blue{background:var(--info-bg);color:var(--primary-dark);}
.badge-muted{background:#F3F4F6;color:#4B5563;}
.badge-danger{background:var(--danger-bg);color:#B91C1C;}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:9px 16px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-weight:600;font-size:13px;
  cursor:pointer;transition:all .15s ease;white-space:nowrap;
}
.btn:hover{background:var(--bg-secondary);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--bg-secondary);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn-danger-ghost{color:var(--danger);border-color:transparent;background:transparent;}
.btn-danger-ghost:hover{background:var(--danger-bg);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.icon-btn{width:32px;height:32px;padding:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg);cursor:pointer;color:var(--text-muted);}
.icon-btn:hover{background:var(--bg-secondary);color:var(--text);}
.icon-btn svg{width:15px;height:15px;}

/* ---------- FORMS ---------- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
.field input[type=text],.field input[type=date],.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);
  outline:none;transition:border-color .15s,box-shadow .15s;resize:vertical;
}
.field textarea{min-height:88px;line-height:1.55;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.field-row{grid-template-columns:1fr;}}

.decision-select{font-weight:700;padding:11px 14px;border-radius:10px;font-size:13.5px;}

/* ---------- PROFILE PAGE ---------- */
.profile-header{
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:22px 24px;margin-bottom:20px;
}
.profile-id-row{display:flex;align-items:center;gap:16px;}
.avatar-lg{
  width:58px;height:58px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;
}
.profile-id-row h1{font-size:20px;margin:0 0 3px;letter-spacing:-.02em;}
.profile-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--text-muted);font-size:12.8px;}
.profile-meta span{display:inline-flex;align-items:center;gap:5px;}
.profile-meta .sep{color:var(--text-faint);}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;}
.back-link:hover{color:var(--primary);}
.back-link svg{width:15px;height:15px;}

.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
@media(max-width:980px){.profile-grid{grid-template-columns:1fr;}}

.info-list{display:flex;flex-direction:column;}
.info-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--text-muted);font-size:12.8px;font-weight:600;flex-shrink:0;width:38%;}
.info-row .v{font-size:13.3px;text-align:right;flex:1;}
.long-text{background:var(--bg-secondary);border-radius:10px;padding:13px 14px;font-size:13px;line-height:1.65;color:#374151;white-space:pre-wrap;}
.subblock{margin-bottom:18px;}
.subblock:last-child{margin-bottom:0;}
.subblock h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:700;margin:0 0 8px;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:var(--info-bg);color:var(--primary-dark);font-size:11.8px;font-weight:600;padding:4px 10px;border-radius:8px;}

/* ---------- SCORES ---------- */
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.score-item label{display:flex;justify-content:space-between;font-size:12.6px;font-weight:600;color:var(--text-muted);margin-bottom:7px;}
.score-item label b{color:var(--text);font-weight:700;}
.stars{display:flex;gap:5px;}
.star{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text-faint);transition:all .12s ease;}
.star:hover{border-color:var(--accent);color:var(--accent);}
.star.filled{background:var(--primary);border-color:var(--primary);color:#fff;}

.avg-score-box{
  display:flex;align-items:center;gap:16px;background:var(--info-bg);border-radius:12px;padding:16px 18px;margin-top:18px;
}
.avg-score-num{font-size:30px;font-weight:800;color:var(--primary-dark);letter-spacing:-.02em;}
.avg-score-label{font-size:12.5px;color:var(--primary-dark);font-weight:600;line-height:1.4;}

/* ---------- DECISION BAR ---------- */
.decision-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:20px 22px;border-radius:var(--radius);margin-top:6px;
  border:1.5px solid var(--border);
}
.decision-options{display:flex;flex-wrap:wrap;gap:8px;}
.decision-pill{
  padding:10px 15px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg);
  font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:all .15s ease;
}
.decision-pill:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.decision-pill.active-success{background:var(--success-bg);border-color:var(--success);color:#15803D;}
.decision-pill.active-warning{background:var(--warning-bg);border-color:var(--warning);color:#B45309;}
.decision-pill.active-blue{background:var(--info-bg);border-color:var(--primary);color:var(--primary-dark);}
.decision-pill.active-muted{background:#F3F4F6;border-color:#9CA3AF;color:#374151;}
.decision-pill.active-danger{background:var(--danger-bg);border-color:var(--danger);color:#B91C1C;}

/* ---------- NOTES ---------- */
.note-item{border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:var(--bg);}
.note-item:last-child{margin-bottom:0;}
.note-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.note-author{font-weight:700;font-size:12.8px;}
.note-date{font-size:11.5px;color:var(--text-faint);}
.note-text{font-size:13.2px;line-height:1.6;color:#374151;white-space:pre-wrap;}
.note-actions{display:flex;gap:6px;}
.note-add-row{display:flex;gap:10px;margin-top:14px;align-items:flex-start;flex-wrap:wrap;}
.note-add-row textarea{flex:1;min-width:220px;min-height:56px;}
.note-add-row input[type=text]{width:150px;flex-shrink:0;}
.empty-note{color:var(--text-faint);font-size:13px;padding:6px 0 4px;}

/* ---------- TABS (candidate profile bottom section) ---------- */
.section-title{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;margin:0;}
.section-title .num{
  width:24px;height:24px;border-radius:7px;background:var(--info-bg);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
}

/* ---------- EMPTY STATE ---------- */
.empty-state{padding:60px 20px;text-align:center;color:var(--text-muted);}
.empty-state svg{width:38px;height:38px;color:var(--text-faint);margin-bottom:10px;}
.empty-state h3{font-size:15px;margin:0 0 4px;color:var(--text);}
.empty-state p{font-size:13px;margin:0;}

/* ---------- KANBAN (Kararlar) ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start;}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}}
.kanban-col{background:var(--bg-secondary);border-radius:var(--radius);border:1px solid var(--border);padding:12px;min-height:120px;}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px;}
.kanban-col-head b{font-size:13px;}
.kanban-count{background:var(--bg);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;color:var(--text-muted);border:1px solid var(--border);}
.kanban-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:box-shadow .15s,transform .15s;}
.kanban-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.kanban-card .kc-name{font-weight:700;font-size:13px;margin-bottom:3px;}
.kanban-card .kc-role{font-size:11.6px;color:var(--text-muted);}

/* ---------- TEAMS VIEW ---------- */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.team-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-sm);}
.team-card h3{font-size:14px;margin:0 0 3px;}
.team-card .team-count{font-size:26px;font-weight:800;color:var(--primary);margin:6px 0 10px;}
.team-mini-list{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto;}
.team-mini-item{font-size:12.5px;display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:7px;background:var(--bg-secondary);cursor:pointer;}
.team-mini-item:hover{background:var(--info-bg);}

/* ---------- TOAST ---------- */
#toast{
  position:fixed;bottom:22px;right:22px;z-index:100;
  background:#111827;color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:all .25s ease;
}
#toast.show{opacity:1;transform:translateY(0);}
#toast svg{width:16px;height:16px;color:var(--success);}

/* ---------- RESPONSIVE ---------- */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;padding:66px 16px 50px;}
  .mobile-toggle{display:flex;}
  .overlay.show{display:block;}
  .kanban{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .kanban{grid-template-columns:1fr;}
  table.candidates{font-size:12.5px;}
  .info-row{flex-direction:column;gap:3px;}
  .info-row .v{text-align:left;}
}

.fade-in{animation:fadeUp .3s ease both;}
</style>
</head>
<body>

<button class="mobile-toggle" id="mobileToggle" aria-label="Menü">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
</button>
<div class="overlay" id="overlay"></div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">LG</div>
      <div class="brand-text"><b>LogisticsGlossary</b><span>HR · Aday Sistemi</span></div>
    </div>
    <nav class="nav" id="mainNav">
      <button class="nav-item" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard

/* ---------- 3. YARDIMCI FONKSİYONLAR ---------- */
function esc(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }
function initials(kod){ return (kod||'??').slice(0,2).toUpperCase(); }
function nowIso(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('tr-TR', {day:'2-digit', month:'short', year:'numeric'}) + ' ' + d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}
function decisionMeta(val){ return DECISION_OPTIONS.find(d=>d.value===val) || DECISION_OPTIONS.find(d=>d.value==='Beklemede'); }
function badgeClassForDecision(val){
  const m = decisionMeta(val);
  return 'badge-' + (m.cls==='blue'?'blue':m.cls);
}
function interviewStatusBadgeClass(status){
  if(status==='Tamamlandı') return 'badge-success';
  if(status==='Planlandı') return 'badge-blue';
  if(status==='İptal Edildi') return 'badge-danger';
  return 'badge-muted';
}
function uid(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function debounce(fn, wait){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); };
}

    risks: '',
    assigned_team: '',
    interview_status: 'Planlanmadı',
    interview_date: '',
    interviewer: '',
    overall_evaluation: '',
    scores,
    development_areas: '',
    interview_risk: '',
    interviewer_recommendation: '',
    manager_notes: [],
    created_at: nowIso(),
    updated_at: nowIso(),
  };
}

async function loadStateFromStorage(){
  setSaveIndicator('loading');
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      STATE = JSON.parse(res.value);
    } else {
      STATE = {};
    }
  }catch(e){
    STATE = {};
  }
  // Eksik adaylar için varsayılan state oluştur (Excel'de olup state'te olmayanlar)
  SEED_CANDIDATES.forEach(c=>{
    if(!STATE[c.kod]){
      STATE[c.kod] = defaultState(c.kod);
    } else {
      // eski kayıtlarda eksik alan olabilir, defaultlarla birleştir
      const base = defaultState(c.kod);
      STATE[c.kod] = Object.assign({}, base, STATE[c.kod]);
      STATE[c.kod].scores = Object.assign({}, base.scores, STATE[c.kod].scores||{});
      if(!Array.isArray(STATE[c.kod].manager_notes)) STATE[c.kod].manager_notes = [];
      // Kaldırılan karar seçenekleri (Eğitim / Yüksek Lisans) eski kayıtlarda varsa Beklemede'ye geçir
      if(!DECISION_OPTIONS.find(d=>d.value===STATE[c.kod].decision)){
        STATE[c.kod].decision = 'Beklemede';
      }
    }
  });
  storageReady = true;
  setSaveIndicator('saved');
}

const persistState = debounce(async function(){
  setSaveIndicator('saving');
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
    if(result){
      setSaveIndicator('saved');
      showToast('Kaydedildi');
    } else {
      setSaveIndicator('error');
    }
  }catch(e){
    setSaveIndicator('error');
  }
}, 450);

function updateCandidateState(kod, patch){
  if(!STATE[kod]) STATE[kod] = defaultState(kod);
  Object.assign(STATE[kod], patch, {updated_at: nowIso()});
  persistState();
}
function updateScore(kod, scoreKey, value){
  if(!STATE[kod]) STATE[kod] = defaultState(kod);
  STATE[kod].scores[scoreKey] = value;
  STATE[kod].updated_at = nowIso();
  persistState();
}

function setSaveIndicator(mode){
  const el = document.getElementById('saveIndicator');
  const txt = document.getElementById('saveIndicatorText');
  if(!el) return;
  el.classList.remove('saved','saving');
  if(mode==='saving'){ el.classList.add('saving'); txt.textContent='Kaydediliyor...'; }
  else if(mode==='saved'){ el.classList.add('saved'); txt.textContent='Kaydedildi'; }
  else if(mode==='loading'){ txt.textContent='Yükleniyor...'; }
  else if(mode==='error'){ txt.textContent='Kayıt hatası'; }
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- 5. VERİ BİRLEŞTİRME ---------- */
function getMergedCandidates(){
  return SEED_CANDIDATES.map(c => Object.assign({}, c, STATE[c.kod] || defaultState(c.kod)));
}
function getCandidate(kod){
  const seed = SEED_CANDIDATES.find(c=>c.kod===kod);
  if(!seed) return null;
  return Object.assign({}, seed, STATE[kod] || defaultState(kod));
}
function avgScore(cand){
  const vals = SCORE_CRITERIA.map(c=>cand.scores[c.key]||0).filter(v=>v>0);
  if(!vals.length) return 0;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}

/* ---- 8b. ÖN DEĞERLENDİRME SKORU (kural bazlı, şeffaf bir başlangıç noktası) ----
   Bu bir "AI kararı" değildir — İK ekibinin mülakat önceliklendirmesi için
   basit, açıklanabilir bir puanlamadır. Nihai karar her zaman mülakat +
   insan değerlendirmesiyle verilmelidir. Mülakat puanı girildiyse (avgScore),
   ön-değerlendirme skorunun yerini alır. */
const ENGLISH_WEIGHT = {'Başlangıç (A1)':1,'Temel (A2)':2,'Orta (B1)':3,'Orta Üstü (B2)':4,'İleri Düzey (C2)':5};
const STATU_WEIGHT = {'Üniversite Öğrencisi':0,'Yeni Mezun':1,'Çalışan / Profesyonel':2,'Diğer':0};
function computePotentialScore(c, skillFreq){
  const reasons = [];
  let score = 0;
  const eng = ENGLISH_WEIGHT[c.ingilizce_seviyesi] || 0;
  score += eng;
  if(eng>=4) reasons.push('İleri seviye İngilizce ('+c.ingilizce_seviyesi+')');
  const statuW = STATU_WEIGHT[c.statu] || 0;
  score += statuW;
  if(statuW===2) reasons.push('Sektörde çalışıyor — ' + (c.pozisyon || c.kurum || 'profesyonel deneyim'));
  if(c.onceki_deneyim_var_mi==='Evet'){ score += 2; reasons.push('Topluluk / kulüp / gönüllülük deneyimi var'); }
  if(c.ogrenim_seviyesi==='Yüksek Lisans'){ score += 1; reasons.push('Yüksek Lisans eğitimi'); }
  if(c.talep_edilen_rol && c.talep_edilen_rol.indexOf('Belirli bir pozisyon')===-1){ score += 1; reasons.push('Net bir rol talep ediyor: ' + c.talep_edilen_rol); }
  const rare = getRareSkills(c, skillFreq);
  if(rare.length){ score += Math.min(rare.length, 2); reasons.push('Nadir yetkinlik: ' + rare.join(', ')); }
  return {score, reasons, rareSkills: rare};
}

/* ---- Nadir yetkinlik tespiti: diğer adayların çoğunda bulunmayan yetkinlikler ---- */
const RARE_SKILL_MAX = 4; // aday havuzunun ~%10'undan azında geçen yetkinlik nadir sayılır
function computeSkillFrequency(list){
  const freq = {};
  list.forEach(c=>{
    (c.yetkinlikler||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{
      freq[s] = (freq[s]||0) + 1;
    });
  });
  return freq;
}
function getRareSkills(c, freq){
  return (c.yetkinlikler||'').split(',').map(s=>s.trim()).filter(Boolean).filter(s=> freq[s] && freq[s] <= RARE_SKILL_MAX);
}

function topCandidatesPanel(list){
  const skillFreq = computeSkillFrequency(list);
  const scored = list
    .filter(c=>c.decision!=='Red') // reddedilenleri öne çıkarma
    .map(c=>Object.assign({}, c, computePotentialScore(c, skillFreq)));

  const ranked = scored.slice().sort((a,b)=>b.score-a.score).slice(0,6);
  const rareOnly = scored
    .filter(c=>c.rareSkills.length>0)
    .sort((a,b)=> b.rareSkills.length - a.rareSkills.length || b.score - a.score);

  if(!ranked.length && !rareOnly.length) return '';

  const cardHtml = (c, extraNote) => `
    <div class="team-card" data-nav-candidate="${esc(c.kod)}" style="cursor:pointer;">

      <div class="cell-muted" style="font-size:12px;margin-bottom:8px;">${esc(shortRole(c.talep_edilen_rol))} · ${esc(c.ingilizce_seviyesi)}</div>
      <ul style="margin:0;padding-left:16px;font-size:12px;color:#374151;line-height:1.6;">
        ${c.reasons.length ? c.reasons.map(r=>`<li>${esc(r)}</li>`).join('') : '<li>Temel kriterleri karşılıyor</li>'}
      </ul>
      ${extraNote || ''}
    </div>`;

  return `
  <div class="panel">
    <div class="panel-header">
      <h2>${iconSvg('target',{size:17,color:'var(--primary)'})} Öne Çıkan Adaylar — Ön Değerlendirme</h2>
      <span class="cell-muted" style="font-size:12px;">Kural bazlı, şeffaf bir sıralama · nihai kararı mülakat belirler</span>
    </div>
    <div class="panel-body">
      <div class="subblock">
        <h3>Genel Skora Göre Öne Çıkanlar</h3>
        <div class="teams-grid">
          ${ranked.map(c=>cardHtml(c)).join('')}
        </div>
      </div>
      ${rareOnly.length ? `
      <div class="subblock" style="margin-top:22px;">
        <h3>${iconSvg('gem',{size:12,color:'var(--accent)'})} Nadir Yetkinliğe Sahip Adaylar</h3>
        <div class="hint" style="margin:-2px 0 12px;">Havuzdaki adayların çoğunda bulunmayan (en fazla ${RARE_SKILL_MAX} adayda geçen) özel yetkinliklere sahip adaylar — kararlarına bakılmaksızın burada listelenir, çünkü havuzda başka kimsenin karşılamadığı bir ihtiyacı doldurabilirler.</div>
        <div class="teams-grid">
          ${rareOnly.map(c=>`
            <div class="team-card" data-nav-candidate="${esc(c.kod)}" style="cursor:pointer;border-color:#DBEAFE;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <h3>Aday ${esc(c.kod.toUpperCase())}</h3>
                <span class="badge ${badgeClassForDecision(c.decision)}" style="padding:2px 8px;font-size:10.5px;">${esc(c.decision)}</span>
              </div>
              <div class="cell-muted" style="font-size:12px;margin-bottom:8px;">${esc(shortRole(c.talep_edilen_rol))}</div>
              <div class="tag-list">${c.rareSkills.map(s=>`<span class="tag" style="background:#EFF6FF;color:var(--accent);">${esc(s)}</span>`).join('')}</div>
            </div>
          `).join('')}
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

function computeKpis(list){
  const total = list.length;
  const reviewed = list.filter(c=>c.interview_status!=='Planlanmadı' || c.decision!=='Beklemede').length;
  const completed = list.filter(c=>c.interview_status==='Tamamlandı').length;
  const pending = list.filter(c=>c.decision==='Beklemede').length;
  const kesin = list.filter(c=>c.decision==='Kesin Kabul').length;
  const red = list.filter(c=>c.decision==='Red').length;
  const beklemede = list.filter(c=>c.decision==='Beklemede').length;
  return {total, reviewed, completed, pending, kesin, red, beklemede};
}

function shortRole(r){
  if(!r) return '—';
  return r.length > 34 ? r.slice(0,34)+'…' : r;
}

function applyFilters(list){
  const f = currentFilters;
  const q = f.q.trim().toLowerCase();
  return list.filter(c=>{
    if(q){
      const hay = [c.kod, c.universite, c.bolum, c.kurum, c.pozisyon, c.talep_edilen_rol, c.assigned_team].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(f.role && c.talep_edilen_rol !== f.role) return false;
    if(f.decision && c.decision !== f.decision) return false;
    if(f.team && c.assigned_team !== f.team) return false;
    if(f.english && c.ingilizce_seviyesi !== f.english) return false;
    if(f.interview && c.interview_status !== f.interview) return false;
    if(f.education && c.ogrenim_seviyesi !== f.education) return false;
    return true;
  });
}

function decisionSelectBg(val){

  const map = {success:'var(--success-bg)', warning:'var(--warning-bg)', blue:'var(--info-bg)', muted:'#F3F4F6', danger:'var(--danger-bg)'};
  return map[m.cls] || '#fff';
}
function decisionBarBg(val){
  return decisionSelectBg(val);
}

/* ---------- 15. OLAY BAĞLAMA (event delegation) ---------- */
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function wireDynamicEvents(){
  const main = document.getElementById('mainContent');

  // Satıra / karta tıklayınca profile git
  main.querySelectorAll('[data-nav-candidate]').forEach(el=>{
    el.addEventListener('click', ()=> navigate('candidate', el.dataset.navCandidate));
  });
  main.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> navigate(el.dataset.nav));
  });

  // ---- Filtreler / Arama ----
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', debounce(e=>{
      currentFilters.q = e.target.value;
      rerenderTableOnly();
    }, 180));
  }
  [['filterRole','role'],['filterDecision','decision'],['filterTeam','team'],['filterEnglish','english'],['filterInterview','interview'],['filterEducation','education']].forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', e=>{ currentFilters[key] = e.target.value; rerenderTableOnly(); });
  });
  const clearBtn = document.getElementById('clearFilters');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    currentFilters = {q:'', role:'', decision:'', team:'', english:'', interview:'', education:''};
    render();
  });

  // ---- Aday profili: Karar (analiz dropdown) ----
  const analysisDecision = document.getElementById('analysisDecision');
  if(analysisDecision){
    analysisDecision.addEventListener('change', e=>{
      const kod = e.target.dataset.kod;
      updateCandidateState(kod, {decision: e.target.value});
      render(); // rozet + kanban + kpi tutarlılığı için tam yeniden render
    });
  }

  // ---- Karar butonları (mülakat formu altındaki karar alanı) ----
  const decisionBar = document.getElementById('decisionBar');
  if(decisionBar){
    decisionBar.addEventListener('click', e=>{
      const btn = e.target.closest('.decision-pill');
      if(!btn) return;
      updateCandidateState(decisionBar.dataset.kod, {decision: btn.dataset.val});
      render();
    });
  }

  // ---- Atanan ekip ----
  const assignedTeam = document.getElementById('assignedTeam');
  if(assignedTeam){
    assignedTeam.addEventListener('change', e=>{
      updateCandidateState(e.target.dataset.kod, {assigned_team: e.target.value});
    });
  }

  // ---- Mülakat bilgileri ----
  const interviewDate = document.getElementById('interviewDate');
  if(interviewDate) interviewDate.addEventListener('change', e=> updateCandidateState(e.target.dataset.kod, {interview_date: e.target.value}));
  const interviewer = document.getElementById('interviewer');
  if(interviewer) interviewer.addEventListener('input', debounce(e=> updateCandidateState(e.target.dataset.kod, {interviewer: e.target.value}), 400));
  const interviewStatus = document.getElementById('interviewStatus');
  if(interviewStatus) interviewStatus.addEventListener('change', e=>{ updateCandidateState(e.target.dataset.kod, {interview_status: e.target.value}); render(); });
  const overallEvaluation = document.getElementById('overallEvaluation');
  if(overallEvaluation) overallEvaluation.addEventListener('input', debounce(e=> updateCandidateState(e.target.dataset.kod, {overall_evaluation: e.target.value}), 400));

  // ---- Serbest metin alanları (data-field ile işaretli tüm textarea'lar) ----
  main.querySelectorAll('textarea[data-field]').forEach(ta=>{
    ta.addEventListener('input', debounce(e=>{
      const kod = e.target.dataset.kod;
      const field = e.target.dataset.field;
      updateCandidateState(kod, {[field]: e.target.value});
      // Aynı alanı gösteren diğer textarea'ları da senkronize et (strengths iki yerde gösteriliyor)
      main.querySelectorAll(`textarea[data-field="${field}"][data-kod="${kod}"]`).forEach(other=>{
        if(other !== e.target) other.value = e.target.value;
      });
    }, 400));
  });

  // ---- Puanlama yıldızları ----
  main.querySelectorAll('.stars').forEach(starGroup=>{
    starGroup.addEventListener('click', e=>{
      const btn = e.target.closest('.star');
      if(!btn) return;
      const kod = starGroup.dataset.kod;
      const key = starGroup.dataset.scoreKey;
      let val = parseInt(btn.dataset.val, 10);
      const current = (STATE[kod] && STATE[kod].scores[key]) || 0;
      if(val === current) val = 0; // aynı yıldıza tekrar tıklayınca sıfırla
      updateScore(kod, key, val);
      render();
    });
  });

  // ---- Yönetici notları ----
  const addNoteBtn = document.getElementById('addNoteBtn');
  if(addNoteBtn){
    addNoteBtn.addEventListener('click', ()=>{
      const kod = addNoteBtn.dataset.kod;
      const text = document.getElementById('noteText').value.trim();
      const author = document.getElementById('noteAuthor').value.trim() || 'İsimsiz';
      if(!text) return;
      if(!STATE[kod]) STATE[kod] = defaultState(kod);
      STATE[kod].manager_notes.push({id: uid(), date: nowIso(), author, text});
      persistState();
      render();
    });
  }
  main.querySelectorAll('[data-action="delete-note"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kod = btn.dataset.kod, noteId = btn.dataset.noteId;
      if(!confirm('Bu notu silmek istediğinize emin misiniz?')) return;
      STATE[kod].manager_notes = STATE[kod].manager_notes.filter(n=>n.id!==noteId);
      persistState();
      render();
    });
  });
  main.querySelectorAll('[data-action="edit-note"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kod = btn.dataset.kod, noteId = btn.dataset.noteId;
      const note = STATE[kod].manager_notes.find(n=>n.id===noteId);
      if(!note) return;
      const viewEl = main.querySelector(`[data-note-text-view="${noteId}"]`);
      if(!viewEl) return;
      viewEl.innerHTML = `<textarea style="width:100%;min-height:70px;margin-bottom:8px;">${esc(note.text)}</textarea>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary btn-sm" data-action="save-note-edit" data-kod="${esc(kod)}" data-note-id="${esc(noteId)}">Kaydet</button>
          <button class="btn btn-sm" data-action="cancel-note-edit">Vazgeç</button>
        </div>`;
      const saveBtn = viewEl.querySelector('[data-action="save-note-edit"]');
      const cancelBtn = viewEl.querySelector('[data-action="cancel-note-edit"]');
      const textarea = viewEl.querySelector('textarea');
      saveBtn.addEventListener('click', ()=>{
        note.text = textarea.value.trim();
        note.date = nowIso();
        persistState();
        render();
      });
      cancelBtn.addEventListener('click', ()=> render());
    });
  });
}

function rerenderTableOnly(){
  // Sadece tablo bulunan panel(ler)i yeniden çiz — filtre state korunur
  const {route} = parseHash();
  if(route!=='dashboard' && route!=='candidates') return render();
  const list = getMergedCandidates();
  const panels = document.querySelectorAll('#mainContent .panel');
  if(panels.length){
    const last = panels[panels.length-1];
    // sadece son (aday tablosu) panelini değiştir; toolbar odaklı input focus kaybını önlemek için sadece sonuç kısmını güncelle
    const resultCount = document.querySelector('.result-count');
    const tableWrap = document.querySelector('.table-wrap');
    const filtered = applyFilters(list);
    if(resultCount) resultCount.textContent = `${filtered.length} / ${list.length} aday gösteriliyor`;
    if(tableWrap){
      tableWrap.outerHTML = filtered.length ? `
      <div class="table-wrap">
      <table class="candidates">
        <thead><tr>
          <th>Aday</th><th>Talep Ettiği Rol</th><th>İngilizce</th><th>Eğitim</th><th>Atanan Ekip</th><th>Karar</th><th>Mülakat</th><th></th>
        </tr></thead>
        <tbody>
          ${filtered.map(c=>`
            <tr data-nav-candidate="${esc(c.kod)}">
              <td><div class="name-cell"><div class="avatar">${initials(c.kod)}</div><div><div class="name-main">Aday ${esc(c.kod.toUpperCase())}</div><div class="name-sub">${esc(c.universite||'—')}</div></div></div></td>
              <td class="cell-muted">${esc(shortRole(c.talep_edilen_rol))}</td>
              <td class="cell-muted">${esc(c.ingilizce_seviyesi||'—')}</td>
              <td class="cell-muted">${esc(c.ogrenim_seviyesi||'—')}</td>
              <td class="cell-muted">${esc(c.assigned_team||'—')}</td>
              <td><span class="badge ${badgeClassForDecision(c.decision)}"><span class="badge-dot"></span>${esc(c.decision)}</span></td>
              <td><span class="badge ${interviewStatusBadgeClass(c.interview_status)}">${esc(c.interview_status)}</span></td>
              <td class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></td>
            </tr>
          `).join('')}
        </tbody>
      </table></div>` : `<div class="table-wrap"><div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <h3>Sonuç bulunamadı</h3><p>Arama veya filtre kriterlerinizi değiştirmeyi deneyin.</p>
        </div></div>`;
      document.querySelectorAll('#mainContent [data-nav-candidate]').forEach(el=>{
        el.addEventListener('click', ()=> navigate('candidate', el.dataset.navCandidate));
      });
    }
  }
}

/* ---------- 16. STATİK NAV / SIDEBAR ---------- */
document.getElementById('mainNav').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-item');
  if(!btn) return;
  navigate(btn.dataset.route);
});
document.getElementById('mobileToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', closeMobileSidebar);

/* ---------- 17. BAŞLANGIÇ ---------- */
(async function init(){
  await loadStateFromStorage();
  if(!location.hash) location.hash = '#/dashboard';
  render();
})();
</script>
</body>
</html>
