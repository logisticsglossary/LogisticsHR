  h+='<div class="card"><h2>2 · Puanlama rehberi</h2><details><summary>1–5 ölçeğini göster</summary>'+
   '<div class="guide"><table>'+SCALE.map(s=>'<tr><td>'+s[0]+' · '+esc(s[1])+'</td><td>'+esc(s[2])+'</td></tr>').join('')+
   '</table><table style="margin-top:10px">'+BANDS.map(x=>'<tr><td>'+x[0]+'–'+x[1]+'</td><td>'+esc(x[2])+'</td></tr>').join('')+
   '</table></div></details></div>';

  h+='<div class="card" id="tot"></div>';

  h+='<h2 style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;font-weight:600">3 · Mülakat soruları ve değerlendirme</h2>';
  QS.forEach((q,i)=>{ const a=n.q[i];
    h+='<div class="qb'+(+a.p>0?' scored':'')+'" data-qb="'+i+'"><div class="qn"><b>SORU '+(i+1)+'</b><h3>'+esc(q[0])+'</h3></div>'+
     '<p class="qs">'+esc(q[1])+'</p><p class="qy">Ölçülen yetkinlik: '+esc(q[2])+'</p>'+
     '<label class="fl">Adayın yanıt notları</label>'+ta('q.'+i+'.y',a.y,'Adayın söylediklerini buraya yazın…')+
     '<div class="scale"><span>Puan</span>'+
       [1,2,3,4,5].map(v=>'<button class="sb'+(+a.p===v?' on':'')+'" data-s="'+i+'" data-v="'+v+'">'+v+'</button>').join('')+
       '<button class="sb clr" data-s="'+i+'" data-v="0">temizle</button>'+
       '<em>'+(+a.p>0?esc(SCALE[a.p-1][1])+' — '+esc(SCALE[a.p-1][2]):'puanlanmadı')+'</em></div>'+
     '<label class="fl" style="margin-top:22px">Görüşmeci yorumu / takip sorusu</label>'+ta('q.'+i+'.c',a.c)+
     '</div>';});

  h+='<div class="card"><h2>4 · Genel değerlendirme</h2><div class="frm">'+
   '<div class="wide"><label class="fl">Güçlü yönler</label>'+ta('ozet.guclu',o.guclu)+'</div>'+
   '<div class="wide"><label class="fl">Gelişim / risk alanları</label>'+ta('ozet.gelisim',o.gelisim)+'</div>'+
   '<div class="wide"><label class="fl">Önerilen uygun rol</label>'+ti('ozet.rol',o.rol)+
     '<p class="hint">Ön analizdeki öneri: '+esc(c.ekip)+'</p></div>'+
   '<div class="wide"><label class="fl">Oryantasyon / eğitim ihtiyacı</label>'+opts('ozet.ory',o.ory,ORY,true,true)+'</div>'+
   '<div class="wide"><label class="fl">Ek not</label>'+ta('ozet.ek',o.ek)+'</div>'+
   '<div class="wide"><label class="fl">Nihai karar</label>'+opts('ozet.nihai',o.nihai,NIHAI,false)+'</div>'+
   '<div class="wide"><label class="fl">Koşul (koşullu kabul ise)</label>'+ti('ozet.kosul',o.kosul)+'</div>'+
   '</div></div>';

  h+='<div class="card"><h2>5 · Görüşmeci onayı</h2><div class="frm">'+
   n.onay.map((r,i)=>'<div><label class="fl">Görüşmeci '+(i+1)+' adı soyadı</label>'+ti('onay.'+i+'.ad',r.ad)+'</div>'+
     '<div><label class="fl">Tarih</label>'+ti('onay.'+i+'.t',r.t)+'</div>').join('')+
   '</div><p class="hint">İmza için formu Markdown olarak indirip yazdırabilirsiniz.</p></div>';
  return h;
}

function renderTotal(){
  const el=$('#tot'); if(!el) return;
  const n=get(cur), t=totalOf(cur), a=answered(cur), bd=band(t);
  el.innerHTML='<h2>Puan özeti — canlı toplam</h2><div class="total">'+
   '<div class="big" style="color:'+(a?bd[3]:'var(--ink)')+'">'+t+'<small>/50</small></div>'+
   '<div class="meter"><i style="width:'+(t/50*100)+'%;background:'+bd[3]+'"></i></div>'+
   (a===10 ? '<div class="band" style="background:'+bd[4]+';color:'+bd[5]+'">'+esc(bd[2])+'</div>'
           : '<div class="miss">'+a+'/10 soru puanlandı — aralık yorumu 10 soru tamamlanınca görünür</div>')+
   '</div><table class="sum">'+QS.map((q,i)=>'<tr><td>'+(i+1)+' · '+esc(q[0])+'</td><td>'+
     (+n.q[i].p>0?n.q[i].p:'—')+'</td></tr>').join('')+
   '<tr class="t"><td>TOPLAM PUAN</td><td>'+t+'/50</td></tr></table>';
}

function pane(){
  const c=C.find(x=>x.id===cur);
  $('#pane').innerHTML = head(c) + (view==='form' ? paneForm(c) : paneBasvuru(c));
  $('#ft').innerHTML = view==='form'
    ? 'Form, STGM Gönüllülük Rehberi ve uluslararası gönüllü mülakat kaynaklarından derlenen "Gönüllü Ekip Üyesi Mülakat Formu" temel alınarak hazırlanmıştır. Girdiğiniz veriler yalnızca bu tarayıcı sekmesinde tutulur; kapatmadan önce <kbd>Kaydet (JSON)</kbd> ile indirin.'
    : 'Ön karar ve değerlendirme notları yalnızca başvuru formu yanıtlarına dayanır; CV, portfolyo veya referans verisi içermez.';
  $('#pane').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;pane();scrollTo(0,0);});
  if (view==='form'){ bind(); renderTotal(); }
}

/* ---------- state binding ---------- */
function setPath(id,path,val){
  const n=get(id), p=path.split('.');
  let o=n; for(let i=0;i<p.length-1;i++) o=o[isNaN(p[i])?p[i]:+p[i]];
  o[isNaN(p[p.length-1])?p[p.length-1]:+p[p.length-1]]=val;
}
function bind(){
  $('#pane').querySelectorAll('[data-p]').forEach(el=>{
    el.oninput=()=>{ setPath(cur,el.dataset.p,el.value); touch(); nav(); };});
  $('#pane').querySelectorAll('[data-s]').forEach(el=>{
    el.onclick=()=>{ const i=+el.dataset.s, v=+el.dataset.v;
      get(cur).q[i].p = (get(cur).q[i].p===v?0:v);
      const qb=$('#pane').querySelector('[data-qb="'+i+'"]');
      qb.classList.toggle('scored', get(cur).q[i].p>0);
      qb.querySelectorAll('.sb[data-v]').forEach(b=>b.classList.toggle('on', +b.dataset.v===get(cur).q[i].p && +b.dataset.v>0));
      const p=get(cur).q[i].p;
      qb.querySelector('.scale em').textContent = p>0 ? SCALE[p-1][1]+' — '+SCALE[p-1][2] : 'puanlanmadı';
      renderTotal(); touch(); nav(); };});
  $('#pane').querySelectorAll('[data-o]').forEach(el=>{
    el.onclick=()=>{ const path=el.dataset.o, v=el.dataset.v, multi=el.dataset.multi==='1';
      const n=get(cur), p=path.split('.'); let o=n; for(let i=0;i<p.length-1;i++) o=o[p[i]];
      const k=p[p.length-1];
      if (multi){ const arr=o[k]; const j=arr.indexOf(v); j>=0?arr.splice(j,1):arr.push(v);
        el.classList.toggle('on', arr.includes(v)); }
      else { o[k] = (o[k]===v?'':v);
        el.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on', b.dataset.v===o[k])); }
      touch(); nav(); };});
}

/* ---------- save / export ---------- */
/* ---------- otomatik kayıt (File System Access API) ---------- */
const FS = typeof window.showSaveFilePicker === 'function';
let fh=null, live=false, tmr=null, busy=false, again=false, t;

function stamp(){ const d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function sv(cls,txt,dot){ const e=$('#sv'); e.className='saved'+(cls?' '+cls:'');
  e.innerHTML=(dot?'<span class="dot"></span>':'')+txt; }
function ok(m){ sv('on','✓ '+m); clearTimeout(t); t=setTimeout(()=>{ if(live) idle(); else sv('',''); },3500); }
function idle(){ sv('on','Otomatik kayıt açık'+(fh?' · '+fh.name:''),1); }

function banner(){
  const b=$('#bar');
  if (live){ b.className='bar'; document.body.classList.remove('hasbar'); }
  else if (FS){ b.className='bar show info';
    b.innerHTML='<span>Otomatik kayıt <b>kapalı</b>. Bir kayıt dosyası seçin — o andan sonra yazdığınız her şey anında diske kaydedilir.</span>'+
      '<button class="go" data-a="link">Otomatik kaydı başlat</button>';
    document.body.classList.add('hasbar'); }
  else { b.className='bar show alert';
    b.innerHTML='<span>Bu tarayıcı otomatik kaydı desteklemiyor. Dosyayı <b>Chrome</b> veya <b>Edge</b> ile açın; '+
      'o zamana kadar not almayın ya da düzenli olarak yedek indirin.</span>'+
      '<button class="go" data-a="bak">Yedek indir</button>';
    document.body.classList.add('hasbar'); }
  const btn=b.querySelector('.go');
  if (btn) btn.onclick=()=>{ btn.dataset.a==='link'?link():backup(); };
  const h=b.classList.contains('show')?b.offsetHeight:0;
  document.documentElement.style.setProperty('--barh',h+'px');
  $('#link').style.display = live||!FS ? 'none':'';
  $('#open').style.display = live||!FS ? 'none':'';
  $('#bak').style.display  = FS&&live ? 'none':'';
  $('#imp').style.display  = FS ? 'none':'';
}

async function rw(h){ const o={mode:'readwrite'};
  if (await h.queryPermission(o)==='granted') return true;
  return await h.requestPermission(o)==='granted'; }

async function link(){
  try{
    fh = await window.showSaveFilePicker({suggestedName:'logisticsglossary-mulakat-kayitlari.json',
      types:[{description:'Mülakat kayıtları',accept:{'application/json':['.json']}}]});
    if(!await rw(fh)){ fh=null; return; }
    live=true; banner(); await flush(true);
  }catch(e){ if(e.name!=='AbortError') alert('Dosya seçilemedi: '+e.message); }
}
async function openFile(){
  try{
    const [h] = await window.showOpenFilePicker({
      types:[{description:'Mülakat kayıtları',accept:{'application/json':['.json']}}]});
    if(!await rw(h)) return;
    const txt = await (await h.getFile()).text();
    if (txt.trim()) loadData(JSON.parse(txt));
    fh=h; live=true; banner(); nav(); pane(); ok('Kayıtlar açıldı · '+h.name);
  }catch(e){ if(e.name!=='AbortError') alert('Dosya açılamadı — geçerli bir kayıt dosyası seçin.'); }
}
let firstEdit=0;
function touch(){
  if(!live){ sv('warn','● Kaydedilmiyor',1); return; }
  sv('','Kaydediliyor…');
  const now=performance.now();
  if(!firstEdit) firstEdit=now;
  clearTimeout(tmr);
  // 450ms sessizlikte yaz; kesintisiz yazımda en geç 3sn'de bir yine yaz
  tmr=setTimeout(flush, now-firstEdit>3000 ? 0 : 450);
}
async function flush(quiet){
  if(!fh) return;
  if(busy){ again=true; return; }
  busy=true;
  try{
    const w = await fh.createWritable();
    await w.write(JSON.stringify({surum:3,kaydedildi:new Date().toISOString(),veri:N},null,1));
    await w.close();
    firstEdit=0; sv('on','Kaydedildi · '+stamp(),1);
  }catch(e){
    live=false; banner();
    sv('warn','Kayıt başarısız — dosyaya erişilemiyor',1);
  }
  busy=false;
  if(again){ again=false; flush(true); }
}
function loadData(j){
  const v=j.veri||j.notlar||j;
  for (const [k,val] of Object.entries(v)){ const c=C.find(x=>x.id===k); if(!c) continue;
    const base=blank(c);
    if (val && val.q){ N[k]=Object.assign(base,val); N[k].ozet=Object.assign(blank(c).ozet,val.ozet||{});
      N[k].bilgi=Object.assign(blank(c).bilgi,val.bilgi||{}); }
    else if (val){ N[k]=base; N[k].ozet.ek=val.not||''; N[k].ozet.nihai=NIHAI.includes(val.karar)?val.karar:'';
      N[k].bilgi.tarih=val.tarih||''; } }
}
function backup(){ dl('logisticsglossary-mulakat-yedek.json',
  JSON.stringify({surum:3,kaydedildi:new Date().toISOString(),veri:N},null,1),'application/json');
  ok('Yedek indirildi'); }
function dl(name,text,type){ const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain;charset=utf-8'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href); }

function mdOne(c){
  const n=N[c.id]; if(!n) return '';
  const b=n.bilgi,o=n.ozet,t=totalOf(c.id),a=answered(c.id);
  const ck=(on)=> on?'[x]':'[ ]';
  let m='# Gönüllü Ekip Üyesi Mülakat Formu — '+c.id+(b.ad?' · '+b.ad:'')+'\n\n';
  m+='## 1. Aday ve Görüşme Bilgileri\n\n| Alan | Bilgi |\n|---|---|\n';
  m+='| Aday Adı Soyadı | '+(b.ad||'')+' |\n| Telefon / E-posta | '+(b.iletisim||'')+' |\n';
  m+='| Başvurduğu Gönüllü Rol | '+(b.rol||'')+' |\n| Topluluk / Ekip Adı | '+(b.ekip||'')+' |\n';
  m+='| Görüşme Tarihi | '+(b.tarih||'')+' |\n| Görüşmeci(ler) | '+(b.gorusmeci||'')+' |\n';
  m+='| Görüşme Türü | '+TUR.map(x=>ck(b.tur===x)+' '+x).join('  ')+' |\n';
  m+='| Adayın Haftalık Müsaitliği | '+(b.musaitlik||'')+' |\n';
  m+='| Önceki Gönüllülük Deneyimi | '+['Evet','Hayır'].map(x=>ck(b.onceki===x)+' '+x).join('  ')+' |\n';
  m+='\n**Başvuru künyesi:** '+c.statu+' · '+c.egitim+' · '+c.bolum+' · '+c.uni+' · '+c.sehir+
     ' · İngilizce '+c.ing+' · ön karar: '+c.karar+'\n\n---\n\n## 2. Mülakat Soruları ve Değerlendirme\n';
  QS.forEach((q,i)=>{ const x=n.q[i];
    m+='\n### Soru '+(i+1)+' — '+q[0]+'\n\n**Soru:** '+q[1]+'\n\n**Ölçülen Yetkinlik:** '+q[2]+'\n\n';
    m+='**Adayın Yanıt Notları:**\n\n> '+((x.y||'').trim().replace(/\n/g,'\n> ')||' ')+'\n\n';
    m+='**Puan:** '+[1,2,3,4,5].map(v=>ck(+x.p===v)+v).join(' ')+(+x.p>0?'  ('+SCALE[x.p-1][1]+')':'')+'\n\n';
    m+='**Görüşmeci Yorumu / Takip Sorusu:**\n\n> '+((x.c||'').trim().replace(/\n/g,'\n> ')||' ')+'\n\n---\n';});
  m+='\n## 3. Puan Özeti\n\n| # | Soru Teması | Puan (1–5) |\n|:---:|---|:---:|\n';
  QS.forEach((q,i)=>{ m+='| '+(i+1)+' | '+q[0]+' | '+(+n.q[i].p>0?n.q[i].p:'')+' |\n'; });
  m+='| | **TOPLAM PUAN** | **'+t+'/50** |\n\n';
  m+= a===10 ? '**Aralık yorumu:** '+band(t)[2]+'\n' : '_'+a+'/10 soru puanlandı — aralık yorumu için form tamamlanmalı._\n';
  m+='\n---\n\n## 4. Genel Değerlendirme\n\n### Güçlü Yönler\n\n> '+((o.guclu||'').trim().replace(/\n/g,'\n> ')||' ')+'\n\n';
  m+='### Gelişim / Risk Alanları\n\n> '+((o.gelisim||'').trim().replace(/\n/g,'\n> ')||' ')+'\n\n';
  m+='### Önerilen Uygun Rol\n\n> '+((o.rol||'').trim()||' ')+'\n\n';
  m+='### Oryantasyon / Eğitim İhtiyacı\n\n'+ORY.map(x=>ck(o.ory.includes(x))+' '+x).join('  ')+'\n\n';
  m+='Ek not: '+((o.ek||'').trim()||'')+'\n\n### Nihai Karar\n\n'+
     NIHAI.map(x=>ck(o.nihai===x)+' **'+x+'**'+(x==='Koşullu Kabul'&&o.kosul?' (şart: '+o.kosul+')':'')).join('\n\n')+'\n\n';
  m+='---\n\n## 5. Görüşmeci Onayı\n\n| Görüşmeci Adı Soyadı | İmza | Tarih |\n|---|---|---|\n'+
     n.onay.map(r=>'| '+(r.ad||'')+' |  | '+(r.t||'')+' |').join('\n')+'\n';
  return m;
}
$('#md1').onclick=()=>{ const c=C.find(x=>x.id===cur);
  if(!filled(c.id)) return alert('Bu adayın mülakat formu henüz doldurulmamış.');
  dl('mulakat-'+c.id+'.md', mdOne(c), 'text/markdown;charset=utf-8'); ok('Form indirildi'); };
$('#mdall').onclick=()=>{
  const done=C.filter(c=>filled(c.id));
  let m='# LogisticsGlossary — Mülakat Formları\n\nDışa aktarma: '+new Date().toLocaleString('tr-TR')+
    '\nDoldurulmuş form: '+done.length+' / '+C.length+'\n\n## Puan tablosu\n\n'+
    '| Aday | Puan | Puanlanan | Nihai karar | Ön karar |\n|---|---:|---:|---|---|\n'+
    done.map(c=>{const n=N[c.id];return '| '+c.id+' | '+totalOf(c.id)+'/50 | '+answered(c.id)+'/10 | '+
      (n.ozet.nihai||'—')+' | '+c.karar+' |';}).join('\n')+'\n\n---\n\n';
  m+=done.map(c=>mdOne(c)).join('\n\n<div style="page-break-after:always"></div>\n\n');
  if(!done.length) return alert('Henüz doldurulmuş form yok.');
  dl('logisticsglossary-mulakat-formlari.md', m, 'text/markdown;charset=utf-8'); ok('Tümü indirildi'); };
$('#link').onclick=link; $('#open').onclick=openFile; $('#bak').onclick=backup;
$('#imp').onclick=()=>$('#fi').click();
$('#fi').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ loadData(JSON.parse(r.result)); nav(); pane(); ok('Yedek yüklendi'); }
    catch(e){ alert('Dosya okunamadı — geçerli bir kayıt dosyası seçin.'); } };
  r.readAsText(f); ev.target.value=''; };
addEventListener('beforeunload',e=>{
  if(!live && C.some(c=>filled(c.id))){ e.preventDefault(); e.returnValue=''; } });
addEventListener('resize',()=>{ const b=$('#bar');
  document.documentElement.style.setProperty('--barh',(b.classList.contains('show')?b.offsetHeight:0)+'px'); });
$('#q').oninput=nav; $('#fk').onchange=nav; $('#fn').onchange=nav;
nav(); pane(); banner();
</script></body></html>
